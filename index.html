<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador Hoja de Transferencia</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --steel-950:#0c1218;
  --steel-900:#131b23;
  --steel-800:#1c2731;
  --steel-700:#2a3742;
  --steel-600:#3d4d59;
  --rail-line:#4a5c68;
  --caution:#ffb020;
  --signal:#ff5a26;
  --paper:#eef2f5;
  --paper-dim:#9fb0bd;
  --ok:#3ddc84;
}

*{box-sizing:border-box}

html,body{height:100%}

body{
  margin:0;
  font-family:'Inter',Arial,sans-serif;
  color:var(--paper);
  background:
    radial-gradient(ellipse at 20% -10%, rgba(255,90,38,.10), transparent 55%),
    radial-gradient(ellipse at 100% 0%, rgba(255,176,32,.07), transparent 45%),
    linear-gradient(180deg,var(--steel-950) 0%, var(--steel-900) 55%, var(--steel-950) 100%);
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}

/* ---------- Fondo: patio ferroviario ---------- */
.railyard{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.55;
}

.railyard svg{width:100%;height:100%;display:block}

.track-lights{
  position:fixed;
  top:22px;
  right:26px;
  display:flex;
  gap:8px;
  z-index:2;
  align-items:center;
}
.track-lights .lamp{
  width:9px;height:9px;border-radius:50%;
  background:var(--steel-600);
  box-shadow:none;
}
.track-lights .lamp.on{
  background:var(--signal);
  box-shadow:0 0 8px 2px rgba(255,90,38,.75);
  animation:pulse 2.4s ease-in-out infinite;
}
.track-lights .lamp.on.b{
  animation-delay:.8s;
  background:var(--caution);
  box-shadow:0 0 8px 2px rgba(255,176,32,.75);
}
@keyframes pulse{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

/* ---------- Contenedor ---------- */
.wrap{
  position:relative;
  z-index:1;
  max-width:880px;
  margin:56px auto 60px;
  padding:0 20px;
}

.card{
  background:linear-gradient(180deg,var(--steel-800),var(--steel-900));
  border:1px solid var(--steel-700);
  border-radius:14px;
  padding:36px 40px 32px;
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.03);
  position:relative;
}

.card::before{
  content:"";
  position:absolute;
  top:0;left:22px;right:22px;
  height:4px;
  background:repeating-linear-gradient(
    -45deg,
    var(--caution) 0 14px,
    var(--steel-900) 14px 28px
  );
  border-radius:0 0 3px 3px;
  opacity:.9;
}

header{margin-bottom:30px}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:.16em;
  color:var(--caution);
  text-transform:uppercase;
  margin-bottom:10px;
}
.eyebrow::before{
  content:"";
  width:16px;height:2px;
  background:var(--caution);
  display:inline-block;
}

h2{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(28px,4vw,38px);
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:0 0 8px;
  color:var(--paper);
  line-height:1.05;
}
h2 em{
  font-style:normal;
  color:var(--signal);
}

.subtitle{
  margin:0;
  color:var(--paper-dim);
  font-size:14.5px;
  max-width:56ch;
}

/* ---------- Controles ---------- */
.row{
  display:flex;
  gap:16px;
  align-items:flex-end;
  margin:0 0 22px;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
  min-width:220px;
}

.field-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--paper-dim);
}

select,textarea,button{
  font-family:inherit;
  color:var(--paper);
}

select{
  appearance:none;
  -webkit-appearance:none;
  background:var(--steel-700) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8"><path d="M1 1l5 5 5-5" stroke="%23eef2f5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') no-repeat right 14px center;
  border:1px solid var(--steel-600);
  border-radius:8px;
  padding:12px 40px 12px 14px;
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s, background-color .15s;
}
select:hover{border-color:var(--signal)}
select:focus-visible{outline:2px solid var(--signal); outline-offset:2px}

textarea{
  width:100%;
  height:280px;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:13.5px;
  line-height:1.6;
  background:var(--steel-950);
  border:1px solid var(--steel-700);
  border-radius:10px;
  padding:16px 18px;
  resize:vertical;
  color:#d7e2ea;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
}
textarea::placeholder{color:#5b6b78}
textarea:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-color:var(--signal)}

.actions{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:22px;
  flex-wrap:wrap;
}

button{
  appearance:none;
  border:0;
  border-radius:8px;
  padding:14px 26px;
  font-size:15px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:uppercase;
  cursor:pointer;
  background:linear-gradient(180deg,#ff7438,var(--signal));
  color:#1a0d05;
  box-shadow:0 10px 22px -8px rgba(255,90,38,.55), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
button:hover{transform:translateY(-1px); box-shadow:0 14px 26px -8px rgba(255,90,38,.7), inset 0 1px 0 rgba(255,255,255,.4)}
button:active{transform:translateY(0)}
button:focus-visible{outline:2px solid var(--paper); outline-offset:3px}

#estado{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  letter-spacing:.02em;
  color:var(--ok);
  min-height:18px;
}

footer.rail-strip{
  margin-top:28px;
  height:10px;
  border-radius:6px;
  background:
    repeating-linear-gradient(90deg, var(--steel-600) 0 3px, transparent 3px 26px),
    var(--steel-700);
  opacity:.8;
}

@media (max-width:560px){
  .card{padding:26px 20px 24px}
  .row{flex-direction:column;align-items:stretch}
}

@media (prefers-reduced-motion:reduce){
  .track-lights .lamp{animation:none}
}
</style>
</head>
<body>

<div class="railyard" aria-hidden="true">
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1218" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c1218" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g stroke="#3d4d59" stroke-width="2" opacity="0.55">
    <line x1="800" y1="430" x2="-200" y2="900"/>
    <line x1="800" y1="430" x2="260" y2="900"/>
    <line x1="800" y1="430" x2="720" y2="900"/>
    <line x1="800" y1="430" x2="1180" y2="900"/>
    <line x1="800" y1="430" x2="1640" y2="900"/>
    <line x1="800" y1="430" x2="2100" y2="900"/>
  </g>
  <g stroke="#2a3742" stroke-width="1" opacity="0.5">
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
  </g>

  <g transform="translate(230,470)" fill="#1c2731" stroke="#3d4d59" stroke-width="2">
    <rect x="0" y="40" width="520" height="90" rx="4"/>
    <rect x="20" y="0" width="480" height="46" rx="3"/>
    <circle cx="60" cy="140" r="18"/>
    <circle cx="150" cy="140" r="18"/>
    <circle cx="370" cy="140" r="18"/>
    <circle cx="460" cy="140" r="18"/>
    <g fill="#2a3742" stroke="none">
      <path d="M40 -6 h60 l10 -18 h50 l10 18 h60 v20 h-190 z"/>
      <path d="M270 -6 h60 l10 -18 h50 l10 18 h60 v20 h-190 z"/>
    </g>
  </g>

  <g transform="translate(880,420) scale(0.75)" fill="#161f28" stroke="#33414c" stroke-width="2" opacity="0.85">
    <rect x="0" y="40" width="520" height="90" rx="4"/>
    <rect x="20" y="0" width="480" height="46" rx="3"/>
    <circle cx="60" cy="140" r="18"/>
    <circle cx="150" cy="140" r="18"/>
    <circle cx="370" cy="140" r="18"/>
    <circle cx="460" cy="140" r="18"/>
    <g fill="#232f3a" stroke="none">
      <path d="M40 -6 h60 l10 -18 h50 l10 18 h60 v20 h-190 z"/>
      <path d="M270 -6 h60 l10 -18 h50 l10 18 h60 v20 h-190 z"/>
    </g>
  </g>

  <rect x="0" y="560" width="1600" height="340" fill="url(#fade)"/>
</svg>
</div>

<div class="track-lights">
  <span class="lamp on"></span>
  <span class="lamp on b"></span>
  <span class="lamp"></span>
</div>

<div class="wrap">
  <div class="card">

    <header>
      <div class="eyebrow">SSA · BMW</div>
      <h2>Hoja de <em>Transferencia de riesgo</em></h2>
      <p class="subtitle">Genera la hoja de transferencia por transporte a partir del layout de carga: VIN, puerto, destino y transporte.</p>
    </header>

    <div class="row">
      <div class="field">
        <label class="field-label" for="tipo">Tipo de unidad</label>
        <select id="tipo">
          <option value="furgon">FURGÓN — 22 registros</option>
          <option value="madrina">MADRINA — 10 registros</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="data">Layout de carga</label>
      <textarea id="data" placeholder="VIN&#9;PUERTO&#9;DESTINO&#9;TRANSPORTE"></textarea>
    </div>

    <div class="actions">
      <button onclick="generarPDF()">Generar PDF</button>
      <div id="estado"></div>
    </div>

    <footer class="rail-strip" aria-hidden="true"></footer>

  </div>
</div>

<script>
const CONFIG={
furgon:{
 plantilla:"CARATULA FURGON.png",
 registros:22,
 filasY:Array.from({length:22},(_,i)=>722+i*61.5),
 xVin:210,xPuerto:990,xDestino:1300,
 xTrans:2950,yTrans:255
},
madrina:{
 plantilla:"CARATULA MADRINA.png",
 registros:10,
 filasY:[880,960,1035,1110,1185,1260,1335,1410,1485,1560],
 xVin:210,xPuerto:900,xDestino:1180,
 xTrans:2900,yTrans:300
}
};

async function generarPDF(){

const estado=document.getElementById("estado");
estado.textContent="Generando PDF...";

const tipo=document.getElementById("tipo").value;
const cfg=CONFIG[tipo];

const texto=document.getElementById("data").value.trim();

if(!texto){
 alert("Pegue el layout.");
 estado.textContent="";
 return;
}

const r=await fetch(cfg.plantilla);
const blob=await r.blob();

const imgData=await new Promise(res=>{
 const fr=new FileReader();
 fr.onload=e=>res(e.target.result);
 fr.readAsDataURL(blob);
});

const {jsPDF}=window.jspdf;
const pdf=new jsPDF("landscape","px",[3300,2550]);

let datos=[];

texto.split(/\r?\n/).forEach(l=>{
 let p=l.split(/\t|,/);
 if(p.length>=4){
   datos.push({
     vin:p[0].trim(),
     puerto:p[1].trim(),
     destino:p[2].trim(),
     transporte:p[3].trim()
   });
 }
});

let grupos={};
datos.forEach(d=>{
 if(!grupos[d.transporte]) grupos[d.transporte]=[];
 grupos[d.transporte].push(d);
});

let primera=true;

for(let t in grupos){

 let lista=grupos[t];

 for(let i=0;i<lista.length;i+=cfg.registros){

   if(!primera) pdf.addPage();
   primera=false;

   pdf.addImage(imgData,"PNG",0,-10,3350,2550);

   let bloque=lista.slice(i,i+cfg.registros);

   bloque.forEach((item,idx)=>{

      let y=cfg.filasY[idx];

      pdf.setFont("helvetica","bold");

      pdf.setFontSize(44);
      pdf.text(item.vin,cfg.xVin,y);

      pdf.setFontSize(40);
      pdf.text(item.puerto,cfg.xPuerto,y);

      pdf.text(item.destino,cfg.xDestino,y);

   });

   pdf.setFontSize(60);
   pdf.text(t,cfg.xTrans,cfg.yTrans);

 }

}

pdf.save("HOJAS DE_TRANSFERENCIA.pdf");
estado.textContent="PDF generado correctamente.";
}
</script>

</body>
</html>
